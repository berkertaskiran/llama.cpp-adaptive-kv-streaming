name: Build Windows CUDA binary

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '13.2.0'
          method: 'local'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev"]'

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake
        shell: cmd
        run: >
          cmake -B build -G "Ninja"
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"
          -DGGML_CUDA=ON
          -DCMAKE_CUDA_ARCHITECTURES=89
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_NATIVE=OFF
          -DGGML_AVX512=OFF

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --target llama-server -j 4

      - name: Collect binaries
        run: |
          mkdir dist
          copy build\bin\Release\llama-server.exe dist\
          copy build\bin\Release\*.dll dist\ 2>nul || echo "no extra dlls, continuing"
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda
          path: dist/
