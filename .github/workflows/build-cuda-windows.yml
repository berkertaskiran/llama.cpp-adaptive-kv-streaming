name: Build Windows CUDA binary

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit via Chocolatey
        shell: powershell
        run: |
          choco install cuda --version=13.2.0 -y --no-progress
          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2" >> $env:GITHUB_ENV
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake
        shell: cmd
        run: >
          cmake -B build -G "Ninja"
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"
          -DGGML_CUDA=ON
          -DCMAKE_CUDA_ARCHITECTURES=89
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_NATIVE=OFF
          -DGGML_AVX512=OFF

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --target llama-server -j 4

      - name: Collect binaries
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build\bin\llama-server.exe dist\
          if (Test-Path build\bin\*.dll) {
            Copy-Item build\bin\*.dll dist\
          } else {
            Write-Host "No local build DLLs - fully static build."
          }
          $cudaBin = "$env:CUDA_PATH\bin"
          Write-Host "Looking for CUDA DLLs in: $cudaBin"
          Get-ChildItem "$cudaBin\*.dll" | Where-Object { $_.Name -match "cudart64|cublas64|cublasLt64|curand64" } | ForEach-Object {
            Copy-Item $_.FullName dist\
            Write-Host "Copied: $($_.Name)"
          }
          $opensslBin = "C:\Program Files\OpenSSL\bin"
          Copy-Item "$opensslBin\libssl-3-x64.dll" dist\ -ErrorAction SilentlyContinue
          Copy-Item "$opensslBin\libcrypto-3-x64.dll" dist\ -ErrorAction SilentlyContinue
          Get-ChildItem dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda
          path: dist/
